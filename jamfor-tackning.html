<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="./assets/language-bootstrap.js"></script>
    <link rel="icon" type="image/png" sizes="32x32" href="./images/browserlogo2-32.png?v=20260821-white-bg" />
    <link rel="icon" type="image/png" sizes="16x16" href="./images/browserlogo2-16.png?v=20260821-white-bg" />
    <link rel="shortcut icon" href="./images/browserlogo2.ico?v=20260821-white-bg" />
    <title>J&auml;mf&ouml;r t&auml;ckning | Dealett</title>
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&amp;display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" />
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.9.0/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="https://unpkg.com/@maplibre/maplibre-gl-geocoder@1.5.0/dist/maplibre-gl-geocoder.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="styles-redesign.css" />
    <link rel="stylesheet" href="styles-editorial.css" />
    <link rel="stylesheet" href="./assets/dealett-ui.css" />
    <link rel="stylesheet" href="./assets/coverage-map-controls.css" />
    <link rel="stylesheet" href="./assets/jamfor-tackning.css" />
  </head>
  <body class="jamfor-page">
    <div data-include="header"></div>

    <main>
      <section class="coverage-main coverage-maplibre-section" id="coverageApp" data-coverage-map="real" data-map-engine="maplibre">
        <div class="coverage-maplibre-shell">
          <section class="coverage-intro" data-header-anchor-target>
            <span class="coverage-eyebrow">Täckning</span>
            <h1>Jämför täckning</h1>
            <p>Se vilket mobilnät som passar bäst där du bor, arbetar eller befinner dig.</p>
          </section>

          <div class="coverage-toolbar" aria-label="Täckningsfilter">
            <div class="coverage-operators" role="group" aria-label="V&auml;lj operat&ouml;r">
              <button class="coverage-maplibre-operator" data-operator="telia" type="button" aria-label="Telia" aria-pressed="false">
                <img src="images/telia.webp" alt="" aria-hidden="true" />
                <span>Telia</span>
              </button>
              <button class="coverage-maplibre-operator" data-operator="tele2" type="button" aria-label="Tele2" aria-pressed="false">
                <img src="images/tele2.webp" alt="" aria-hidden="true" />
                <span>Tele2</span>
              </button>
              <button class="coverage-maplibre-operator" data-operator="telenor" type="button" aria-label="Telenor" aria-pressed="false">
                <img src="images/telenor.svg" alt="" aria-hidden="true" />
                <span>Telenor</span>
              </button>
              <button class="coverage-maplibre-operator" data-operator="tre" type="button" aria-label="Tre" aria-pressed="false">
                <img src="images/tre.jpg" alt="" aria-hidden="true" />
                <span>Tre</span>
              </button>
            </div>

            <p class="coverage-network-label">Välj nät</p>
            <div class="coverage-networks" role="group" aria-label="V&auml;lj ett eller flera n&auml;t">
              <button class="coverage-maplibre-network" data-network="4G" type="button" aria-pressed="false">4G</button>
              <button class="coverage-maplibre-network" data-network="4G+" type="button" aria-pressed="false">4G+</button>
              <button class="coverage-maplibre-network" data-network="5G" type="button" aria-pressed="false">5G</button>
              <button class="coverage-maplibre-network" data-network="5G+" type="button" aria-pressed="false">5G+</button>
            </div>
            <div class="coverage-maplibre-search" id="coverageGeocoder" role="search" aria-label="S&ouml;k adress eller plats"></div>
            <div class="coverage-maplibre-actions" aria-label="Kartgenv&auml;gar">
              <button class="coverage-maplibre-action" data-map-action="locate" type="button">
                <i class="fa-solid fa-location-dot" aria-hidden="true"></i> Använd min plats <span aria-hidden="true">›</span>
              </button>
            </div>

          </div>
          <div id="coverageMapLibre" class="coverage-maplibre-canvas" aria-label="Interaktiv t&auml;ckningskarta"></div>

          <div class="coverage-maplibre-quality-key" aria-label="F&auml;rgf&ouml;rklaring f&ouml;r t&auml;ckningsniv&aring;">
            <p>T&auml;ckningsniv&aring;</p>
            <span><i class="is-excellent" aria-hidden="true"></i>Mycket god</span>
            <span><i class="is-good" aria-hidden="true"></i>God</span>
            <span><i class="is-basic" aria-hidden="true"></i>Bas</span>
          </div>

          <div class="coverage-maplibre-themes" aria-label="Kartutseende">
            <button class="is-active" data-map-theme="auto" title="Följ dagsljuset i Sverige" type="button" aria-pressed="true"><i class="fa-regular fa-sun" aria-hidden="true"></i><span>Auto</span></button>
            <button data-map-theme="light" title="Ljust kartutseende" type="button" aria-pressed="false"><i class="fa-regular fa-sun" aria-hidden="true"></i><span>Ljust</span></button>
            <button data-map-theme="dark" title="Mörkt kartutseende" type="button" aria-pressed="false"><i class="fa-regular fa-moon" aria-hidden="true"></i><span>Mörkt</span></button>
            <button id="coverageMapPerspective" title="Växla mellan 2D och 3D" class="coverage-maplibre-perspective is-active" type="button" aria-label="V&auml;xla mellan 2D och 3D" aria-pressed="true"><i class="fa-solid fa-cube" aria-hidden="true"></i><span>3D</span></button>
          </div>

          <div class="coverage-maplibre-zoom" aria-label="Kartverktyg">
            <button id="coverageMapZoomIn" type="button" aria-label="Zooma in">+</button>
            <button id="coverageMapZoomOut" type="button" aria-label="Zooma ut">&minus;</button>
            <button id="coverageMapCompass" title="Rotera mot norr" class="coverage-maplibre-compass" type="button" aria-label="Rotera kartan mot norr"></button>

          </div>

          <p class="coverage-disclaimer">Kartan visar uppskattad täckning. Den faktiska upplevelsen kan variera med plats, byggnader och utrustning.</p>
        </div>
      </section>
    </main>

    <div data-include="footer"></div>

    <script src="https://unpkg.com/maplibre-gl@5.9.0/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/@maplibre/maplibre-gl-geocoder@1.5.0/dist/maplibre-gl-geocoder.min.js"></script>
    <script src="./assets/cart-helpers.js"></script>
    <script src="./assets/network-utils.js"></script>
    <script src="script.js?v=20260825-3"></script>
    <script src="./assets/coverage-maplibre.js"></script>
  </body>
</html>
