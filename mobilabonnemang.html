<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="./assets/language-bootstrap.js"></script>
  <link rel="icon" href="./images/favicon.svg" type="image/svg+xml" />
  <title>Dealett – Abonnemang</title>

  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="./assets/mobilabonnemang.css" />
    <link rel="stylesheet" href="styles-redesign.css" />
    <link rel="stylesheet" href="styles-editorial.css" />
  <link rel="stylesheet" href="./assets/dealett-ui.css" />
  </head>

<body class="abon-page mobile-plans-page" data-header-mode="solid" data-header-theme="dark">
  <div data-include="header"></div>

  <main class="abon-main">
    <section class="hero-shell shop-hero" data-header-anchor-target>
      <img
        src="images/editorial-mobile-sim.png"
        alt="Streamingtjänster och mobilabonnemang"
        class="shop-hero-image"
        fetchpriority="high"
        decoding="async"
      />

      <div class="shop-hero-content">
        <nav class="shop-breadcrumb" aria-label="Brödsmulor">
        </nav>

        <h1>Mobilabonnemang</h1>
        <p class="shop-hero-lead">Jämför surf, pris och operatör på ett ställe.</p>
      </div>
    </section>

    <section id="offersSection" class="result-section">
      <div class="result-shell">
        <div class="section-head shop-list-head reveal">
          <h2>Jämför alla mobilabonnemang</h2>
        </div>

        <div id="offersStrip" class="offers-strip reveal">
          <div class="plan-toolbar" aria-label="Filtrera abonnemang">
            <div>
              <span class="plan-toolbar-label">Operatör</span>
              <div id="operatorFilter" class="operator-filter" role="group" aria-label="Välj operatör"></div>
            </div>
            <div class="range-filter data-range-filter">
              <span class="range-filter-head">
                <label class="plan-toolbar-label" for="dataFilter">Surf</label>
                <button id="dataFilterAll" class="range-all-button" type="button">Alla</button>
              </span>
              <output id="dataFilterValue" class="range-current-value" for="dataFilter">—</output>
              <div class="range-scale">
                <input id="dataFilter" type="range" min="0" max="0" value="0" step="1" aria-label="Välj surfmängd" />
                <span id="dataFilterTicks" class="range-ticks" aria-hidden="true"></span>
              </div>
            </div>
          </div>

          <div id="offersTrack" class="offers-track">
            <div class="offers-inner">
              <div id="offers-container" class="offers-container"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section id="rewardSection" class="result-section is-hidden">
      <div class="result-shell result-narrow">
        <div class="section-head center reveal">
          <span class="section-kicker">Belöningar</span>
          <h2>Välj presentkort</h2>
          <p>Fördela hela värdet tydligt innan du går vidare.</p>
        </div>

        <div class="pro-card reward-panel reveal">
          <div class="reward-summary-bar">
            <div>
              <span>Totalt belöningsvärde</span>
              <strong><span id="totalReward">0</span> kr</strong>
            </div>

            <div class="reward-progress">
              <div id="rewardProgressFill" class="reward-progress-fill"></div>
            </div>

            <div class="reward-summary-right">
              <span>Återstår</span>
              <strong id="remainingSumWrap"><span id="remainingSum">0</span> kr</strong>
            </div>
          </div>

          <div id="rewardGrid" class="reward-grid-native"></div>

          <button id="rewardContinueBtn" class="primary-btn full-btn" disabled>
            Lägg till i varukorg
          </button>
        </div>
      </div>
    </section>
  </main>

  <div data-include="footer"></div>

  <script src="./assets/cart-helpers.js"></script>
  <script src="./assets/network-utils.js"></script>
  <script src="./assets/offer-compare.js"></script>
  <script src="./assets/offers.js"></script>
  <script src="script.js"></script>
</body>
</html>
