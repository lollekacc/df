<head>
    <meta name="robots" content="noindex, nofollow" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/png" sizes="16x16" href="./images/browserlogo2-16.png?v=20260821-white-bg" />
    <link rel="shortcut icon" href="./images/browserlogo2.ico?v=20260821-white-bg" />

  <link rel="preconnect" href="https://api.fontshare.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&amp;display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="./assets/mobilabonnemang.css" />
  <link rel="stylesheet" href="./assets/5g-bredband.css" />
  <link rel="stylesheet" href="./assets/familjabonnemang.css" />
    <link rel="stylesheet" href="styles-redesign.css" />
    <link rel="stylesheet" href="styles-editorial.css" />
  <link rel="stylesheet" href="./assets/dealett-ui.css" />
  <link rel="stylesheet" href="./assets/subscription-pages.css" />

  <link rel="stylesheet" href="./assets/subscription-broadband.css" />
</head>

<body class="subscription-page abon-page family-page">
  <div data-include="header"></div>

  <main class="abon-main">
    <section id="offersSection" class="result-section" aria-labelledby="plansTitle">
      <div class="result-shell">
        <header class="shop-hero" data-header-anchor-target>
          <div class="shop-hero-content">
            <h1 id="plansTitle">Familjabonnemang</h1>
            <p class="shop-hero-lead">Välj hur många abonnemang ni behöver och filtrera på operatör.</p>
          </div>
        </header>
        <div id="offersStrip" class="offers-strip reveal">
          <div class="bredband-filters" aria-label="Filtrera familjeabonnemang">
            <div class="bredband-filter-group">
              <label for="operatorFilter">Operatör</label>
              <select id="operatorFilter" aria-label="Välj operatör"></select>
            </div>
            <div class="bredband-filter-group">
              <label for="familySize">Antal abonnemang</label>
              <select id="familySize" aria-label="Välj antal abonnemang">
                <option value="2">2</option>
                <option value="3" selected>3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
              </select>
            </div>
            <div class="bredband-filter-group">
              <label for="dataFilter">Surf per användare</label>
              <select id="dataFilter" aria-label="Välj surfmängd"><option value="all">Alla</option></select>
              <button type="button" class="surf-trigger" data-surf-calculator aria-haspopup="dialog"><i class="fa-solid fa-calculator" aria-hidden="true"></i>Hur mycket surf behöver jag?</button>
            </div>
          </div>

          <div id="offersTrack" class="offers-track">
            <div class="offers-inner">
              <div id="offers-container" class="offers-container"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <dialog id="rewardSection" class="subscription-reward-dialog" aria-labelledby="rewardTitle">
      <button class="modal-close-btn" type="button" data-reward-close aria-label="Stäng">×</button>
      <div class="result-shell result-narrow">
        <div class="section-head">
          <span class="section-kicker">Belöningar</span>
          <h2 id="rewardTitle">Välj presentkort</h2>
          <p>Fördela hela värdet tydligt innan du går vidare.</p>
        </div>

        <div class="pro-card reward-panel">
          <div class="reward-summary-bar">
            <div>
              <span>Totalt belöningsvärde</span>
              <strong><span id="totalReward">0</span> kr</strong>
            </div>

            <div class="reward-progress">
              <div id="rewardProgressFill" class="reward-progress-fill"></div>
            </div>

            <div class="reward-summary-right">
              <span>Återstår</span>
              <strong id="remainingSumWrap"><span id="remainingSum">0</span> kr</strong>
            </div>
          </div>

          <div id="rewardGrid" class="reward-grid-native"></div>

          <button id="rewardContinueBtn" class="primary-btn full-btn" disabled>
            Lägg till i varukorg
          </button>
        </div>
      </div>
    </dialog>
  </main>

  <aside id="subscriptionSelection" class="bredband-sticky-bar" hidden>
    <div class="bredband-sticky-inner">
      <strong id="subscriptionSelectedText" aria-live="polite"></strong>
      <button id="subscriptionContinue" class="bredband-primary-btn" type="button">Belöningar</button>
    </div>
  </aside>

  <div data-include="footer"></div>

  <script src="./assets/cart-helpers.js"></script>
  <script src="./assets/network-utils.js"></script>
  <script src="./assets/offer-compare.js"></script>
  <script src="./assets/subscription-ui.js"></script>
  <script src="./assets/family-offers.js"></script>
  <script src="script.js?v=20260825-3"></script>
  <script src="./assets/surf-calculator.js"></script>

</body>
</html>
