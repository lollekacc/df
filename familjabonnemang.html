<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="./assets/language-bootstrap.js"></script>
    <link rel="icon" type="image/png" sizes="32x32" href="./images/browserlogo2-32.png?v=20260821-white-bg" />
    <link rel="icon" type="image/png" sizes="16x16" href="./images/browserlogo2-16.png?v=20260821-white-bg" />
    <link rel="shortcut icon" href="./images/browserlogo2.ico?v=20260821-white-bg" />
  <title>Dealett – Familjabonnemang</title>

  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="./assets/mobilabonnemang.css" />
  <link rel="stylesheet" href="./assets/familjabonnemang.css" />
    <link rel="stylesheet" href="styles-redesign.css" />
    <link rel="stylesheet" href="styles-editorial.css" />
  <link rel="stylesheet" href="./assets/dealett-ui.css" />
  <link rel="stylesheet" href="./assets/offer-list-cleanup.css" />
  </head>

<body class="abon-page family-page" data-header-mode="solid" data-header-theme="dark">
  <div data-include="header"></div>

  <main class="abon-main">
    <section class="hero-shell shop-hero family-hero" data-header-anchor-target>
      <img
        src="images/editorial-home-router.png"
        alt="Familjeabonnemang för flera mobiler i hemmet"
        class="shop-hero-image"
        fetchpriority="high"
        decoding="async"
      />

      <div class="shop-hero-content">
        <nav class="shop-breadcrumb" aria-label="Brödsmulor">
        </nav>

        <h1>Familjabonnemang</h1>
        <p class="shop-hero-lead">Välj hur många abonnemang ni behöver och filtrera på operatör.</p>
      </div>
    </section>

    <section id="offersSection" class="result-section">
      <div class="result-shell">
        <div id="offersStrip" class="offers-strip reveal">
          <div class="plan-toolbar" aria-label="Filtrera familjeabonnemang">
            <div>
              <span class="plan-toolbar-label">Operatör</span>
              <div id="operatorFilter" class="operator-filter" role="group" aria-label="Välj operatör"></div>
            </div>
            <div class="range-filter family-size-filter">
              <span class="range-filter-head">
                <label class="plan-toolbar-label" for="familySize">Antal abonnemang</label>
              </span>
              <output id="familySizeValue" class="range-current-value" for="familySize">3</output>
              <div class="range-scale">
                <input id="familySize" type="range" min="2" max="10" value="3" step="1" aria-label="Välj antal abonnemang" />
                <span class="range-ticks" aria-hidden="true">
                  <span data-label="2"></span><span data-label="3"></span><span data-label="4"></span>
                  <span data-label="5"></span><span data-label="6"></span><span data-label="7"></span>
                  <span data-label="8"></span><span data-label="9"></span><span data-label="10"></span>
                </span>
              </div>
            </div>
            <div class="range-filter data-range-filter">
              <span class="range-filter-head">
                <label class="plan-toolbar-label" for="dataFilter">Surf per användare</label>
                <button id="dataFilterAll" class="range-all-button is-active" type="button" aria-pressed="true">Alla</button>
              </span>
              <output id="dataFilterValue" class="range-current-value" for="dataFilter">Alla</output>
              <div class="range-scale">
                <input id="dataFilter" type="range" min="0" max="0" value="0" step="1" aria-label="Välj surfmängd" />
                <span id="dataFilterTicks" class="range-ticks" aria-hidden="true"></span>
              </div>
            </div>
          </div>

          <div id="offersTrack" class="offers-track">
            <div class="offers-inner">
              <div id="offers-container" class="offers-container"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section id="rewardSection" class="result-section is-hidden">
      <div class="result-shell result-narrow">
        <div class="section-head center reveal">
          <span class="section-kicker">Belöningar</span>
          <h2>Välj presentkort</h2>
          <p>Fördela hela värdet tydligt innan du går vidare.</p>
        </div>

        <div class="pro-card reward-panel reveal">
          <div class="reward-summary-bar">
            <div>
              <span>Totalt belöningsvärde</span>
              <strong><span id="totalReward">0</span> kr</strong>
            </div>

            <div class="reward-progress">
              <div id="rewardProgressFill" class="reward-progress-fill"></div>
            </div>

            <div class="reward-summary-right">
              <span>Återstår</span>
              <strong id="remainingSumWrap"><span id="remainingSum">0</span> kr</strong>
            </div>
          </div>

          <div id="rewardGrid" class="reward-grid-native"></div>

          <button id="rewardContinueBtn" class="primary-btn full-btn" disabled>
            Lägg till i varukorg
          </button>
        </div>
      </div>
    </section>
  </main>

  <div data-include="footer"></div>

  <script src="./assets/cart-helpers.js"></script>
  <script src="./assets/network-utils.js"></script>
  <script src="./assets/offer-compare.js"></script>
  <script src="./assets/family-offers.js"></script>
  <script src="script.js"></script>
</body>
</html>
